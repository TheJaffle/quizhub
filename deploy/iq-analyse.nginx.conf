# Bloc nginx a INSERER dans le server { ... } HTTPS existant qui sert deja ton
# site (fichier /etc/nginx/sites-enabled/quizhub).
#
# Le "/" final de proxy_pass retire le prefixe /iq-analyse avant de transmettre
# a l'outil. Comme les appels du client sont relatifs, tout fonctionne sous ce
# chemin. Acces final : https://TON_DOMAINE/iq-analyse/
#
# Apres modification :
#   sudo nginx -t && sudo systemctl reload nginx

location /iq-analyse/ {
    proxy_pass http://127.0.0.1:4555/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
