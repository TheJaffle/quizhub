server {
    listen 80 default_server;
    server_name 51.255.82.201 _;
    location /videos/ {
        alias /var/www/videos/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin *;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    server_name qi-free.com www.qi-free.com brainspark.fr www.brainspark.fr 51.255.82.201;

    if ($host ~* ^(www\.)?brainspark\.fr$) {
        rewrite ^/$ /iq/sondage permanent;
    }

    location = /iq-analyse {
        return 301 /iq-analyse/;
    }
    location /iq-analyse/ {
        proxy_pass http://127.0.0.1:4555/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brainspark.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brainspark.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.brainspark.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = brainspark.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name qi-free.com www.qi-free.com brainspark.fr www.brainspark.fr 51.255.82.201;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
